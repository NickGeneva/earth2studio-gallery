site_name: Earth2Studio Gallery
site_description: UV-native executable example galleries for Zensical and MkDocs Material
site_url: https://nickgeneva.github.io/earth2studio-gallery/
repo_url: https://github.com/NickGeneva/earth2studio-gallery
repo_name: NickGeneva/earth2studio-gallery
strict: true

theme:
  name: material
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - earth2studio-gallery:
      examples_dir: docs/examples
      output_dir: gallery
      execute: never
      jobs: 1
      collect_telemetry: true

# Zensical does not execute third-party MkDocs plugin hooks yet, so declare the
# generated gallery stylesheet explicitly. The MkDocs plugin de-duplicates it.
extra_css:
  - assets/stylesheets/earth2studio-gallery.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Authoring examples: authoring.md
  - Example gallery: gallery/index.md
  - Runtime telemetry: telemetry.md
  - Caching and rendering: caching.md
  - Configuration: configuration.md
  - Development: development.md
